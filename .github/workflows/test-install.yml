name: Test Install Script

on:
  push:
    branches: [master]
    paths:
      - 'scripts/install_and_build.sh'
      - '.github/workflows/test-install.yml'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/install_and_build.sh'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  test-install:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check macOS version
        run: |
          sw_vers
          uname -m

      - name: Check pre-installed tools
        run: |
          echo "=== Xcode CLI ==="
          xcode-select -p || echo "Not installed"
          echo ""
          echo "=== Homebrew ==="
          which brew || echo "Not installed"
          echo ""
          echo "=== Git ==="
          git --version || echo "Not installed"
          echo ""
          echo "=== Flutter ==="
          which flutter || echo "Not installed"
          echo ""
          echo "=== Node.js ==="
          node --version || echo "Not installed"
          echo ""
          echo "=== CocoaPods ==="
          which pod || echo "Not installed"

      - name: Run install script (non-interactive)
        env:
          CI: true
          NONINTERACTIVE: 1
          HOMEBREW_NO_INTERACTIVE: 1
        run: |
          # 스크립트 다운로드
          curl -fsSL https://raw.githubusercontent.com/ParkShinUng/flutter-csias-desktop/master/scripts/install_and_build.sh -o /tmp/install.sh

          # 대화형 프롬프트 제거
          sed -i '' 's/read -p "계속하시겠습니까? (y\/n): " -n 1 -r/REPLY="y"/g' /tmp/install.sh
          sed -i '' 's/read -p "삭제하고 새로 설치하시겠습니까? (y\/n): " -n 1 -r/REPLY="y"/g' /tmp/install.sh
          sed -i '' 's/read -p "Xcode Command Line Tools 설치가 완료되면 Enter를 눌러주세요..."/echo "Xcode CLI 확인 중..."/g' /tmp/install.sh
          sed -i '' 's/read -p "Chrome 설치 후 Enter를 누르거나, 나중에 설치하려면 그냥 Enter를 누르세요..."/echo "Chrome 확인 스킵"/g' /tmp/install.sh
          sed -i '' 's/read -p "지금 CSIAS Desktop을 실행하시겠습니까? (y\/n): " -n 1 -r/REPLY="n"/g' /tmp/install.sh

          chmod +x /tmp/install.sh
          /bin/bash /tmp/install.sh

      - name: Verify source code download
        run: |
          echo "=== Source directory ==="
          ls -la ~/Desktop/csias_desktop/
          echo ""
          echo "=== Key files ==="
          ls -la ~/Desktop/csias_desktop/lib/main.dart
          ls -la ~/Desktop/csias_desktop/pubspec.yaml

      - name: Verify Node.js binary
        run: |
          echo "=== Node.js binary ==="
          ls -la ~/Desktop/csias_desktop/assets/bin/macos/
          ~/Desktop/csias_desktop/assets/bin/macos/node-darwin-x64-darwin-arm64 --version

      - name: Verify runner modules
        run: |
          echo "=== Runner node_modules ==="
          ls -la ~/Desktop/csias_desktop/assets/runner/node_modules/ | head -20

      - name: Verify app build
        run: |
          echo "=== Built app ==="
          ls -la ~/Desktop/csias_desktop.app/
          echo ""
          echo "=== App contents ==="
          ls -la ~/Desktop/csias_desktop.app/Contents/
          echo ""
          echo "=== App binary ==="
          ls -la ~/Desktop/csias_desktop.app/Contents/MacOS/

      - name: Test app launch (dry run)
        run: |
          # 앱이 실행 가능한지 확인 (실제 실행은 하지 않음)
          file ~/Desktop/csias_desktop.app/Contents/MacOS/csias_desktop
          codesign -vvv ~/Desktop/csias_desktop.app || echo "Signature check completed"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: csias_desktop-macos
          path: ~/Desktop/csias_desktop.app
          retention-days: 7
